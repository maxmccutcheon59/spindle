name: Restore Cargo.lock
on:
  push:
    paths:
      - 'ci/cargo-lock.b64.*'
      - '.github/workflows/restore-cargo-lock.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble Cargo.lock from b64 chunks
        run: |
          set -euo pipefail
          cat ci/cargo-lock.b64.* | base64 -d > Cargo.lock
          # verify
          test "$(wc -c < Cargo.lock)" -eq 30439
          head -n 1 Cargo.lock | grep -q 'automatically @generated by Cargo'
          grep -q 'aho-corasick' Cargo.lock
          # must not be stubs
          ! grep -q PLACEHOLDER Cargo.lock
          ! grep -q LOAD_FROM_FILE Cargo.lock
      - name: Commit restored Cargo.lock
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          if git diff --cached --quiet; then
            echo "Cargo.lock already correct"
            exit 0
          fi
          git commit -m "Restore complete Cargo.lock (CI-ready)"
          git push
