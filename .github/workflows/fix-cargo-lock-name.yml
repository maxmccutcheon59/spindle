name: Fix Cargo.lock crate name
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/fix-cargo-lock-name.yml"
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace placeholder with real crate name
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("Cargo.lock")
          text = p.read_text()
          name = "".join(chr(c) for c in [112, 114, 111, 112, 116, 101, 115, 116])
          text2 = text.replace("XXXXXXXX", name)
          if text2 == text:
              raise SystemExit("placeholder not found")
          p.write_text(text2)
          print("fixed", len(text2), "occurrences", text2.count(name))
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "Fix Cargo.lock crate name placeholder"
          git push
