name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm install
      - name: Build static site for GitHub Pages
        run: npm run build:static
        env:
          SPINDLE_STATIC: "1"
          NEXT_PUBLIC_BASE_PATH: "/spindle"
          NEXT_PUBLIC_SITE_URL: "https://maxmccutcheon59.github.io/spindle"
          # Optional: set these in repo Settings → Secrets so every customer can pay on Pages
          NEXT_PUBLIC_STRIPE_PAYMENT_LINK_BUILDER: ${{ secrets.NEXT_PUBLIC_STRIPE_PAYMENT_LINK_BUILDER }}
          NEXT_PUBLIC_STRIPE_PAYMENT_LINK_SCALE: ${{ secrets.NEXT_PUBLIC_STRIPE_PAYMENT_LINK_SCALE }}
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
